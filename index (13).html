<!doctype html>
<html lang="it" data-site>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invasori</title>
<meta name="description" content="Gioca a Invasori, sparatutto spaziale online gratis: Sfida del giorno, modalità Classica e Dinamica con power-up e boss. Dal browser, senza download.">
<meta name="theme-color" content="#07060f">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: cabinato a schermo unico — comandi e punteggi in alto, campo 3:4 centrato, schede sovrapposte al campo, link ai giochi sotto il campo in home */
:root{
  --bg:#07060f;
  --panel:#0f0d1f;
  --line:#2a2546;
  --fg:#efeaff;
  --dim:#8e86b3;
  --accent:#ffcf4a;
  --hot:#ff5fa2;
  --cool:#3cc8ff;
  --go:#4be38a;
  --f-disp:"Silkscreen","Courier New",monospace;
  --f-ui:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;padding-inline:12px;padding-block:8px;box-sizing:border-box;gap:8px;max-width:640px;margin:0 auto}
.bar{display:flex;align-items:center;gap:8px}
.bar .spacer{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.stat small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat b{font-family:var(--f-disp);font-size:18px;font-weight:400;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.score b{color:var(--accent)}
.lives{display:flex;gap:4px;align-items:center;height:21px}
.lives i{display:block;width:16px;height:10px;background:var(--fg);
  clip-path:polygon(50% 0,64% 40%,100% 70%,100% 100%,0 100%,0 70%,36% 40%)}
.ibtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  font:600 12px var(--f-ui);height:34px;min-width:34px;padding:0 10px;border-radius:6px;cursor:pointer}
.ibtn:hover{border-color:var(--dim)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.lang button{appearance:none;border:0;background:none;color:var(--dim);font:700 12px var(--f-ui);letter-spacing:.06em;height:32px;min-width:38px;padding:0 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:#07060f}
.ibtn:focus-visible,.mode:focus-visible,.btn:focus-visible,.tab:focus-visible,.lang button:focus-visible,.allgames:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#fx{display:flex;gap:6px;flex-wrap:wrap;min-height:20px;font-size:11px}
#fx span{padding:2px 7px;border-radius:4px;border:1px solid currentColor;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#fx .mult{color:var(--accent)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.frame{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#05040c;
  box-shadow:0 0 0 4px #0b0918,0 20px 60px -20px #000}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);
  mix-blend-mode:screen}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(5,4,12,.8);backdrop-filter:blur(2px);z-index:2;overflow:auto}
#oBoard{z-index:3;background:rgba(5,4,12,.92)}
.card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:13px;text-align:center;margin:auto}
.logo{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,10vw,56px);line-height:.9;margin:0;letter-spacing:.02em;
  color:var(--fg);text-shadow:3px 3px 0 var(--go),6px 6px 0 #0f3a24}
.sub{margin:0;color:var(--dim);font-size:13px;line-height:1.5;text-wrap:balance}
.table{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0;padding:0;list-style:none}
.table li{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim)}
.table canvas{width:44px;height:30px;cursor:default}
.table b{font-family:var(--f-disp);font-weight:400;color:var(--fg);font-size:13px;font-variant-numeric:tabular-nums}
.tlabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{appearance:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;
  background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--f-ui)}
.mode:hover{border-color:var(--dim)}
.mode .n{font-family:var(--f-disp);font-size:18px;overflow-wrap:anywhere}
.mode .d{font-size:11px;color:var(--dim);line-height:1.4}
.mode .r{font-size:11px;color:var(--dim);margin-top:4px}
.mode .r b{color:var(--fg);font-variant-numeric:tabular-nums}
.mode.c .n{color:var(--cool)}
.mode.dy .n{color:var(--hot)}
.mode.sf{grid-column:1/-1;border-color:#5a4a1a;background:linear-gradient(180deg,#1a1508,var(--panel))}
.mode.sf .n{color:var(--accent)}
.extras{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pws{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px;font-size:11px;color:var(--dim);text-align:left}
.pws li{display:flex;align-items:center;gap:6px;min-width:0}
.pws i{font-style:normal;font-weight:700;font-size:10px;min-width:22px;height:14px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#07060f;flex:none}
.keys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:4px 10px;font-size:11px;margin:0;text-align:left;color:var(--dim)}
.keys dt{color:var(--fg);font-weight:700}
.keys dd{margin:0}
.touchhint{display:none;font-size:12px;color:var(--dim);margin:0;line-height:1.5}
@media (hover:none) and (pointer:coarse){.keys{display:none}.touchhint{display:block}}
.h2{font-family:var(--f-disp);font-size:26px;margin:0;color:var(--go)}
.big{font-family:var(--f-disp);font-size:46px;color:var(--accent);font-variant-numeric:tabular-nums}
.meta{margin:0;color:var(--dim);font-size:12px;line-height:1.5}
.meta b{color:var(--fg)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;cursor:pointer;font:700 13px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;
  padding:12px 18px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1300}
.newrec{font-family:var(--f-disp);color:var(--accent);font-size:14px;margin:0}
.share{margin:0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:#0b0918;
  font:600 13px/1.6 var(--f-ui);white-space:pre-wrap;text-align:left;color:var(--fg);-webkit-user-select:text;user-select:text}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tab{appearance:none;cursor:pointer;font:700 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;
  padding:9px 4px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--dim)}
.tab[aria-selected="true"]{color:#1a1300;background:var(--accent);border-color:var(--accent)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;min-height:120px;text-align:left}
.board li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;background:var(--panel);font-size:13px}
.board li.loc{grid-template-columns:minmax(0,1fr) auto}
.board li .p{font-family:var(--f-disp);color:var(--dim);font-variant-numeric:tabular-nums}
.board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.board li .nm em{font-style:normal;color:var(--go)}
.board li .sc{font-family:var(--f-disp);color:var(--accent);font-variant-numeric:tabular-nums}
.board li.me{outline:1px solid var(--go)}
.board .empty{background:none;display:block;text-align:center;color:var(--dim);font-size:12px;padding:24px 8px;line-height:1.5}
.banner{position:absolute;left:0;right:0;top:44%;text-align:center;pointer-events:none;z-index:1;padding-inline:12px;
  font-family:var(--f-disp);font-size:28px;color:var(--fg);text-shadow:2px 2px 0 var(--go)}
.banner small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--dim);text-shadow:none;margin-top:6px;letter-spacing:.1em;text-transform:uppercase}
.allgames{display:block;box-sizing:border-box;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:700 clamp(11px,3.4vw,13px) var(--f-ui);letter-spacing:.02em;padding:12px 10px;border-radius:8px;
  border:1px solid var(--accent);background:var(--panel);color:var(--accent);text-decoration:none}
.allgames:hover{background:var(--accent);color:#1a1300}
/* incorporato in un iframe del sito: altezza dettata dalla larghezza */
html.embed,html.embed body{height:auto}
html.embed #app{height:auto}
html.embed .stage{flex:none;width:100%;aspect-ratio:3/4}
@media (prefers-reduced-motion:reduce){.frame::after{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="ibtn" id="bHome" type="button" data-i18n-aria="aHome">⌂</button>
    <div class="lang" role="group" data-i18n-aria="aLang">
      <button type="button" id="bIt" lang="it" aria-pressed="true">IT</button>
      <button type="button" id="bEn" lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="spacer"></div>
    <button class="ibtn" id="bSound" type="button" data-i18n-aria="aSound">♪ on</button>
    <button class="ibtn" id="bPause" type="button" data-i18n-aria="aPause">II</button>
  </div>
  <div class="stats">
    <div class="stat score"><small data-i18n="hScore">punti</small><b id="hScore">0</b></div>
    <div class="stat"><small data-i18n="hBest">record</small><b id="hBest">0</b></div>
    <div class="stat"><small data-i18n="hWave">ondata</small><b id="hWave">1</b></div>
    <div class="stat"><small data-i18n="hLives">vite</small><div class="lives" id="hLives"></div></div>
  </div>
  <div id="fx" aria-live="polite"></div>
  <div class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="cv"></canvas>
      <div class="banner" id="banner" hidden></div>

      <div class="overlay" id="oHome">
        <div class="card">
          <h1 class="logo">INVASORI</h1>
          <p class="sub" data-i18n="sub"></p>
          <div>
            <p class="tlabel" data-i18n="tableLabel"></p>
            <ul class="table" id="ptable">
              <li><canvas data-k="a" width="88" height="60"></canvas><b>30</b></li>
              <li><canvas data-k="b" width="88" height="60"></canvas><b>20</b></li>
              <li><canvas data-k="c" width="88" height="60"></canvas><b>10</b></li>
              <li><canvas data-k="u" width="88" height="60"></canvas><b>???</b></li>
            </ul>
          </div>
          <div class="modes">
            <button class="mode sf" id="bSfida" type="button">
              <span class="n" data-i18n="sfidaName"></span>
              <span class="d" data-i18n="sfidaDesc"></span>
              <span class="r" id="tSfida"></span>
            </button>
            <button class="mode c" id="bClassic" type="button">
              <span class="n" data-i18n="classicName"></span>
              <span class="d" data-i18n="classicDesc"></span>
              <span class="r"><span data-i18n="recordLabel"></span> <b id="tBestC">0</b></span>
            </button>
            <button class="mode dy" id="bDynamic" type="button">
              <span class="n" data-i18n="dynName"></span>
              <span class="d" data-i18n="dynDesc"></span>
              <span class="r"><span data-i18n="recordLabel"></span> <b id="tBestD">0</b></span>
            </button>
          </div>
          <div class="extras">
            <button class="ibtn" id="bBoard" type="button"></button>
            <button class="ibtn" id="bShake" type="button"></button>
          </div>
          <ul class="pws" id="pwList" data-i18n-aria="aPwList"></ul>
          <dl class="keys">
            <dt>← →</dt><dd data-i18n="kMove"></dd>
            <dt data-i18n="kMouse"></dt><dd data-i18n="kMove"></dd>
            <dt data-i18n="kSpace"></dt><dd data-i18n="kFire"></dd>
            <dt>P · Esc</dt><dd data-i18n="kPause"></dd>
          </dl>
          <p class="touchhint" data-i18n="touchHint"></p>
        </div>
      </div>

      <div class="overlay" id="oPause" hidden>
        <div class="card">
          <h2 class="h2" data-i18n="pauseTitle"></h2>
          <div class="row">
            <button class="btn pri" id="bResume" type="button" data-i18n="resume"></button>
            <button class="btn" id="bQuit" type="button" data-i18n="homeBtn"></button>
          </div>
        </div>
      </div>

      <div class="overlay" id="oOver" hidden>
        <div class="card">
          <h2 class="h2" id="oTitle"></h2>
          <p class="meta" id="oMode"></p>
          <div class="big" id="oScore">0</div>
          <p class="newrec" id="oNew" data-i18n="newRecord" hidden></p>
          <p class="meta"><span data-i18n="waveLabel"></span> <b id="oWave">1</b> · <span data-i18n="recordLabel"></span> <b id="oBest">0</b></p>
          <div id="oShare" hidden>
            <pre class="share" id="shareTxt"></pre>
          </div>
          <p class="meta" id="oNote" hidden></p>
          <div class="row">
            <button class="btn" id="bCopy" type="button" hidden></button>
            <button class="btn pri" id="bAgain" type="button" data-i18n="again"></button>
          </div>
          <div class="row">
            <button class="btn" id="bOverBoard" type="button"></button>
            <button class="btn" id="bOverHome" type="button" data-i18n="homeBtn"></button>
          </div>
        </div>
      </div>

      <div class="overlay" id="oBoard" hidden>
        <div class="card">
          <h2 class="h2" id="boardTitle"></h2>
          <div class="tabs" role="tablist" id="boardTabs">
            <button class="tab" role="tab" data-b="sfida" type="button" data-i18n="tabToday"></button>
            <button class="tab" role="tab" data-b="dinamica" type="button" data-i18n="dynName"></button>
            <button class="tab" role="tab" data-b="classica" type="button" data-i18n="classicName"></button>
          </div>
          <ol class="board" id="boardList"></ol>
          <p class="meta" id="boardNote"></p>
          <div class="row"><button class="btn pri" id="bBoardClose" type="button" data-i18n="close"></button></div>
        </div>
      </div>
    </div>
  </div>
  <a class="allgames" id="allGames" href="https://universosportivo.com/giochi" target="_top" data-i18n="allGames"></a>
</div>

function shieldCell(c, r){
  if (r <= 2) return (c <= 4) || (c >= 8 && c <= 13) || (c >= 17);
  if (r >= 8 && c >= 8 && c <= 13) return false;
  if (r === 11 && (c === 0 || c === 21)) return false;
  return true;
}
function buildShields(){
  shields = [];
  for (let i=1;i<=4;i++){
    const cxp = W*i/5, cells = new Uint8Array(SGW*SGH);
    for (let r=0;r<SGH;r++) for (let c=0;c<SGW;c++) cells[r*SGW+c] = shieldCell(c,r) ? 1 : 0;
    shields.push({ x: Math.round(cxp - SGW*SC/2), y: SHIELD_Y, cells });
  }
}
function crumble(s, c0, r0, rad){
  for (let dr=-rad; dr<=rad; dr++) for (let dc=-rad; dc<=rad; dc++){
    const c = c0+dc, r = r0+dr; if (c<0||c>=SGW||r<0||r>=SGH) continue;
    const d = Math.hypot(dc, dr);
    if (d <= .5 || Math.random() < 1 - d/(rad+1)) s.cells[r*SGW+c] = 0;
  }
}
function shieldPoint(x, y, rad){
  for (const s of shields){
    if (x < s.x || x >= s.x + SGW*SC || y < s.y || y >= s.y + SGH*SC) continue;
    const c = Math.floor((x - s.x)/SC), r = Math.floor((y - s.y)/SC);
    if (s.cells[r*SGW+c]){ crumble(s, c, r, rad); return true; }
  }
  return false;
}
function shieldSeg(x, y0, y1, rad){
  const a = Math.min(y0,y1), b = Math.max(y0,y1);
  for (let y=a; y<=b; y+=3) if (shieldPoint(x, y, rad)) return true;
  return false;
}
function eraseRect(x0, y0, x1, y1){
  for (const s of shields){
    if (x1 < s.x || x0 > s.x + SGW*SC || y1 < s.y || y0 > s.y + SGH*SC) continue;
    const c0 = Math.max(0, Math.floor((x0-s.x)/SC)), c1 = Math.min(SGW-1, Math.floor((x1-s.x)/SC));
    const r0 = Math.max(0, Math.floor((y0-s.y)/SC)), r1 = Math.min(SGH-1, Math.floor((y1-s.y)/SC));
    for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++) s.cells[r*SGW+c] = 0;
  }
}

function updateMovers(dt){

/* ---------- boss ---------- */
function updateBoss(dt){
  const b = boss; if (!b) return;
  b.t += dt; if (b.flash > 0) b.flash -= dt;
  const rage = 1 + (1 - b.hp/b.max) * .8;
  b.fireT -= dt;
  const ready = b.fireT <= 0 && b.y > 140 && !dying;
  if (b.kind === 'colosso'){
    b.y += (180 - b.y) * Math.min(1, dt*1.4);
    b.x = W/2 + Math.sin(b.t * .8 * rage) * 160;
    if (ready){
      const p = b.pat++ % 3;
      if (p === 0){ const base = Math.atan2(ship.x - b.x, PY - b.y);
        for (let i=-2;i<=2;i++){ const a = base + i*.18; enemyShoot(b.x, b.y + 30, Math.sin(a)*260, Math.cos(a)*260, 3); } }
      else if (p === 1){ for (const s of [-70, 70]) for (let i=0;i<3;i++) enemyShoot(b.x + s, b.y + 26 + i*22, 0, 250, 3); }
      else { for (let i=0;i<9;i++){ const a = -.9 + i*.225; enemyShoot(b.x, b.y + 30, Math.sin(a)*220, Math.cos(a)*220, 3); } }
      b.fireT = 1.6 / rage;
    }
  } else if (b.kind === 'alveare'){
    b.y += (190 - b.y) * Math.min(1, dt*1.2);
    b.x = W/2 + Math.sin(b.t * .6) * 130;
    b.spawnT -= dt;
    if (b.spawnT <= 0 && b.y > 140 && !dying){ b.spawnT = 2.8 / rage; spawnMini(b.x - 26, b.y + 50, -80, 190); spawnMini(b.x + 26, b.y + 50, 80, 190); }
    if (ready){
      const base = Math.atan2(ship.x - b.x, PY - b.y);
      if (b.pat++ % 3 === 2) for (let i=-1;i<=1;i++){ const a = base + i*.25; enemyShoot(b.x, b.y + 55, Math.sin(a)*250, Math.cos(a)*250, 3); }
      else enemyShoot(b.x, b.y + 55, Math.sin(base)*280, Math.cos(base)*280, 3);
      b.fireT = 1 / rage;
    }
  } else {
    b.y += (210 - b.y) * Math.min(1, dt*1.2);
    b.x = W/2 + Math.sin(b.t * .5) * 120;
    b.rot += dt * 1.2 * rage;
    for (const s of b.segs) if (s.hp <= 0){ s.down -= dt; if (s.down <= 0) s.hp = 3; }
    if (ready){
      if (b.pat++ % 2 === 0){ const off = Math.random()*TAU; for (let i=0;i<12;i++){ const a = off + i*TAU/12; enemyShoot(b.x, b.y, Math.cos(a)*190, Math.abs(Math.sin(a))*190 + 40, 3); } }
      else { const base = Math.atan2(ship.x - b.x, PY - b.y); for (const o of [-.08, .08]) enemyShoot(b.x, b.y + 20, Math.sin(base+o)*290, Math.cos(base+o)*290, 3); }
      b.fireT = 2 / rage;
    }
  }
}
function prismaSeg(i){ const a = boss.rot + i*TAU/8; return { x: boss.x + Math.cos(a)*64, y: boss.y + Math.sin(a)*64, a }; }
function damageBoss(n, x, y){

function updateBolts(dt){
  for (let i=pBolts.length-1; i>=0; i--){

        if (Math.abs(eb.x - b.x) < 6 && eb.y > b.y - 14 && eb.y < b.y + 14){ eBolts.splice(j,1); burst(b.x, b.y, '#ffcf4a', 6, 100); dead = true; break; } }
    }

      const pts = UFO_PTS[shots % 15] * mult();
      addScore(pts); floatText(ufo.x, ufo.y, fmt(pts), '#ff5fa2'); burst(ufo.x, ufo.y, '#ff5fa2', 22, 220); boomAt(ufo.x, ufo.y, '#ff5fa2', 1.6); SFX.ufoHit(); hitStop(.08);
      if (dyn() && !demo) drops.push({ x:ufo.x, y:ufo.y, k:pickPower() });
      markHit(b); ufo = null; dead = true;
    }
    if (!dead && boss){
      if (boss.kind === 'prisma'){
        for (let k=0;k<8;k++){ const sg = boss.segs[k]; if (sg.hp <= 0) continue; const p = prismaSeg(k);
          if (Math.hypot(b.x - p.x, b.y - p.y) < 14){ sg.hp -= b.pierce ? 3 : 1; if (sg.hp <= 0){ sg.down = 6; burst(p.x, p.y, '#3cc8ff', 10, 140); } else burst(b.x, b.y, '#3cc8ff', 3, 70); SFX.block(); markHit(b); dead = true; break; } }
        if (!dead && Math.hypot(b.x - boss.x, b.y - boss.y) < 24){ markHit(b); damageBoss(b.pierce ? 2 : 1, b.x, b.y); dead = true; }
      } else {
        const dx = (b.x - boss.x)/(boss.w/2), dy = (b.y - boss.y)/(boss.h/2);

      }

  }

    b.x += b.vx*dt; b.y += b.vy*dt;

    else if (b.x < -10 || b.x > W + 10 || b.y < -20) dead = true;

    else if (ship.alive && ship.inv <= 0 && Math.abs(b.x - ship.x) < SHIP_W/2 - 3 && b.y > PY - 14 && b.y < PY + 12){ dead = true; playerHit(); }

function applyPower(k){

function gameOver(){

  let isNew = false, bestShown = 0;

  if (isSfida){

}

async function loadBoard(){
  $('boardTitle').textContent = db ? t('boardTitle') : t('localTitle');
  if (!db){ localBoard(); return; }
  const list = $('boardList'), note = $('boardNote');
  $('boardTabs').hidden = false;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x.dataset.b === boardTab)));
  const field = boardTab === 'sfida' ? 'sfidaPunti' : boardTab;
  const emptyLi = txt => { const li = document.createElement('li'); li.className = 'empty'; li.textContent = txt; list.replaceChildren(li); };
  emptyLi(t('loading')); note.textContent = '';
  const tab = boardTab, l0 = lang;
  try {
    let q = db.collection('classifica');
    if (tab === 'sfida') q = q.where('sfidaData', '==', TODAY);
    q = q.orderBy(field, 'desc').limit(10);
    const snap = await q.get();
    if (tab !== boardTab || l0 !== lang) return;
    const rows = snap.docs.map(d => ({ id:d.id, v:Number((d.data() || {})[field]) || 0 })).filter(r => r.v > 0);
    if (!rows.length) emptyLi(tab === 'sfida' ? t('emptyToday') : t('emptyMode'));
    else {
      let names = {};
      if (usr && usr.profiles){ try { names = await usr.profiles(rows.map(r => r.id)) || {}; } catch(e){} }
      if (tab !== boardTab || l0 !== lang) return;
      list.replaceChildren();
      rows.forEach((r, i) => {
        const li = document.createElement('li'); if (r.id === myId) li.className = 'me';
        const p = document.createElement('span'); p.className = 'p'; p.textContent = String(i+1);
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = (names[r.id] && names[r.id].name) || t('player');
        if (r.id === myId){ const em = document.createElement('em'); em.textContent = ' · ' + t('you'); nm.appendChild(em); }
        const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = fmt(r.v);
        li.append(p, nm, sc); list.appendChild(li);
      });
    }
    note.textContent = tab === 'sfida' ? t('noteToday', dayLabel()) : t('noteBest');
  } catch(e){
    if (tab !== boardTab) return;
    emptyLi(t('loadError'));
  }
}
function openBoard(){ $('oBoard').hidden = false; loadBoard(); }
document.querySelectorAll('.tab').forEach(x => x.addEventListener('click', () => { boardTab = x.dataset.b; loadBoard(); }));
function paintBoardBtns(){ const l = db ? t('boardBtn') : t('localBtn'); $('bBoard').textContent = l; $('bOverBoard').textContent = l; }

/* ---------- HUD ---------- */
function renderHud(){
  $('hScore').textContent = fmt(demo ? 0 : score);
  let rec;
  if (demo) rec = best.dinamica;
  else if (mode === 'sfida'){ const s = sfidaLocal(); rec = Math.max(s ? s.score : 0, score); }
  else rec = Math.max(best[mode], score);
  $('hBest').textContent = fmt(rec);
  $('hWave').textContent = demo ? 1 : wave;
  const n = demo ? 3 : Math.max(0, lives);
  const el = $('hLives'); if (el.childElementCount !== n) el.innerHTML = '<i></i>'.repeat(n);
}
function renderFx(){
  let s = '';
  if (!demo && running && dyn()){
    const m = mult(); if (m > 1) s += '<span class="mult">' + t('combo', m) + '</span>';
    for (const k in pw) s += '<span style="color:' + PW[k].col + '">' + pwName(k) + ' ' + Math.ceil(pw[k]) + '</span>';
    if (bubble) s += '<span style="color:#4be38a">' + t('shieldFx') + '</span>';
  }
  if (s !== fxStr){ fxStr = s; $('fx').innerHTML = s; }
}

function drawEnemy(g, type, x, y, f, armored, flash, open){
  const col = flash ? '#ffffff' : TYPES[type].col;
  g.save(); g.translate(x, y);
  g.fillStyle = col; g.strokeStyle = col; g.lineWidth = 2; g.lineCap = 'round'; g.lineJoin = 'round';
  if (type === 'a'){
    g.beginPath(); g.moveTo(0,-10); g.lineTo(12,0); g.lineTo(0,10); g.lineTo(-12,0); g.closePath(); g.fill();
    g.beginPath();
    if (f){ g.moveTo(-5,-6); g.lineTo(-10,-12); g.moveTo(5,-6); g.lineTo(10,-12); }
    else { g.moveTo(-3,-8); g.lineTo(-4,-13); g.moveTo(3,-8); g.lineTo(4,-13); }
    const s = f ? 4 : -4; g.moveTo(12,0); g.lineTo(16,s); g.moveTo(-12,0); g.lineTo(-16,s);
    g.stroke();
    g.fillStyle = '#05040c'; g.fillRect(-4,-2,8,4); g.fillStyle = col; g.fillRect(f ? -3 : 1,-1,2,2);
  } else if (type === 'b'){
    g.beginPath(); g.moveTo(-13,0); g.lineTo(-7,-8); g.lineTo(7,-8); g.lineTo(13,0); g.lineTo(7,8); g.lineTo(-7,8); g.closePath(); g.fill();
    g.beginPath();
    if (f){ g.moveTo(-6,8); g.lineTo(-11,12); g.moveTo(6,8); g.lineTo(11,12); g.moveTo(0,8); g.lineTo(0,11); }
    else { g.moveTo(-5,8); g.lineTo(-5,12); g.moveTo(5,8); g.lineTo(5,12); }
    g.stroke();
    g.fillStyle = '#05040c'; g.beginPath(); g.arc(0,0,4.5,0,TAU); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(f ? -1.5 : 1.5, 0, 1.8, 0, TAU); g.fill();
  } else if (type === 'c'){
    const wy = f ? -9 : -2;
    g.beginPath(); g.moveTo(-15, wy); g.lineTo(-5,-3); g.lineTo(0,-8); g.lineTo(5,-3); g.lineTo(15, wy);
    g.lineTo(10,7); g.lineTo(0,3); g.lineTo(-10,7); g.closePath(); g.fill();
    g.fillStyle = '#05040c'; g.fillRect(-6,-1,4,2); g.fillRect(2,-1,4,2);
  } else if (type === 'd'){
    const gap = f ? 2 : 0;
    g.beginPath(); g.moveTo(-1-gap,-10); g.lineTo(-13-gap,6); g.lineTo(-1-gap,6); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(1+gap,-10); g.lineTo(13+gap,6); g.lineTo(1+gap,6); g.closePath(); g.fill();
    g.strokeStyle = '#ffcf4a'; g.lineWidth = 1.5; g.setLineDash([2,2]); g.beginPath(); g.moveTo(0,-11); g.lineTo(0,8); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#05040c'; g.fillRect(-8-gap,0,4,2); g.fillRect(4+gap,0,4,2);
  } else if (type === 's'){
    g.beginPath(); g.arc(0,-2,9,0,TAU); g.fill();
    g.beginPath(); g.moveTo(-9,-6); g.lineTo(-13,-11); g.moveTo(9,-6); g.lineTo(13,-11); g.stroke();
    g.fillStyle = '#05040c'; g.fillRect(-4,-4,8,3);
    g.fillStyle = flash ? '#ffffff' : '#efeaff';
    if (open){ g.fillRect(-17,6,5,8); g.fillRect(12,6,5,8); }
    else { g.fillRect(-15,9,30,4); g.fillStyle = col; g.fillRect(-15,13,30,1); }
  } else {
    g.beginPath(); g.moveTo(0,-7); g.lineTo(7,0); g.lineTo(0,7); g.lineTo(-7,0); g.closePath(); g.fill();
    g.fillStyle = '#05040c'; g.fillRect(-2,-1,4,2);
  }
  if (armored){
    g.strokeStyle = '#efeaff'; g.lineWidth = 1.5; g.beginPath();
    for (const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ g.moveTo(sx*17, sy*9); g.lineTo(sx*17, sy*13); g.lineTo(sx*12, sy*13); }
    g.stroke();
  }
  g.restore();
}
function drawUfo(g, x, y, tm){
  g.save(); g.translate(x, y);
  g.fillStyle = '#3cc8ff'; g.beginPath(); g.ellipse(0,-4,10,8,0,Math.PI,0); g.fill();
  g.fillStyle = '#ff5fa2'; g.beginPath(); g.ellipse(0,1,24,7,0,0,TAU); g.fill();
  for (let i=-2;i<=2;i++){ g.fillStyle = ((Math.floor(tm*8) + i) & 1) ? '#ffcf4a' : '#05040c'; g.fillRect(i*8 - 1.5, 0, 3, 3); }
  g.restore();
}
function drawShip(x, y){
  const g = cx; g.save(); g.translate(x, y);
  g.fillStyle = '#ff8a3d'; const fl = 4 + (Math.floor(clock*20) & 1) * 3;
  g.beginPath(); g.moveTo(-4,11); g.lineTo(0,11 + fl); g.lineTo(4,11); g.fill();
  g.fillStyle = '#efeaff';
  g.beginPath(); g.moveTo(0,-15); g.lineTo(5,-6); g.lineTo(8,-6); g.lineTo(10,2); g.lineTo(21,6); g.lineTo(21,11);
  g.lineTo(-21,11); g.lineTo(-21,6); g.lineTo(-10,2); g.lineTo(-8,-6); g.lineTo(-5,-6); g.closePath(); g.fill();
  g.fillStyle = '#3cc8ff'; g.fillRect(-2,-5,4,7);
  g.fillStyle = '#ffcf4a'; g.fillRect(-21,8,6,3); g.fillRect(15,8,6,3);
  g.restore();
}
const coreCol = f => f > .6 ? '#3cc8ff' : f > .3 ? '#ffcf4a' : '#ff4d4d';
function drawBoss(b){
  const g = cx, frac = b.hp/b.max;
  g.save(); g.translate(b.x, b.y);
  if (b.kind === 'colosso'){
    g.fillStyle = b.flash > 0 ? '#ffffff' : '#2a1640'; g.strokeStyle = '#ff5fa2'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-90,-10); g.lineTo(-60,-36); g.lineTo(60,-36); g.lineTo(90,-10); g.lineTo(80,20); g.lineTo(40,38); g.lineTo(-40,38); g.lineTo(-80,20); g.closePath();
    g.fill(); g.stroke();
    g.strokeStyle = '#5a2c74'; g.lineWidth = 2; g.beginPath();
    g.moveTo(-60,-36); g.lineTo(-40,0); g.lineTo(40,0); g.lineTo(60,-36); g.moveTo(-40,0); g.lineTo(-40,38); g.moveTo(40,0); g.lineTo(40,38); g.stroke();
    g.fillStyle = '#ff5fa2'; g.fillRect(-76,18,12,14); g.fillRect(64,18,12,14);
    g.fillStyle = coreCol(frac); g.beginPath(); g.arc(0,12,14 + Math.sin(clock*6)*2,0,TAU); g.fill();
    g.fillStyle = '#05040c'; g.beginPath(); g.arc(0,12,6,0,TAU); g.fill();
  } else if (b.kind === 'alveare'){
    const hex = (r, ox=0, oy=0) => { g.beginPath(); for (let k=0;k<6;k++){ const a = Math.PI/6 + k*Math.PI/3; g[k?'lineTo':'moveTo'](ox + Math.cos(a)*r, oy + Math.sin(a)*r); } g.closePath(); };
    g.fillStyle = b.flash > 0 ? '#ffffff' : '#2a2008'; g.strokeStyle = '#f4e04d'; g.lineWidth = 3; hex(66); g.fill(); g.stroke();
    g.strokeStyle = '#6a5a18'; g.lineWidth = 2;
    for (const [ox,oy] of [[-22,-22],[22,-22],[-36,4],[36,4],[0,-34]]){ hex(13, ox, oy); g.stroke(); }
    g.fillStyle = coreCol(frac); g.beginPath(); g.ellipse(0, 30, 20 + Math.sin(clock*5)*2, 12, 0, 0, TAU); g.fill();
    g.fillStyle = '#05040c'; g.beginPath(); g.ellipse(0, 30, 9, 5, 0, 0, TAU); g.fill();
  } else {
    for (let k=0;k<8;k++){ const sg = b.segs[k]; if (sg.hp <= 0) continue; const a = b.rot + k*TAU/8;
      g.save(); g.translate(Math.cos(a)*64, Math.sin(a)*64); g.rotate(a + Math.PI/2);
      g.fillStyle = sg.hp >= 3 ? '#3cc8ff' : sg.hp === 2 ? '#2a8ab0' : '#1a5470'; g.fillRect(-12,-5,24,10);
      g.fillStyle = '#efeaff'; g.fillRect(-12,-5,24,2); g.restore(); }
    g.rotate(clock * .8);
    g.fillStyle = b.flash > 0 ? '#ffffff' : coreCol(frac); g.strokeStyle = '#efeaff'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0,-26); g.lineTo(22,0); g.lineTo(0,26); g.lineTo(-22,0); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#05040c'; g.fillRect(-5,-5,10,10);
  }
  g.restore();
  const bw = 300, bx = (W - bw)/2;
  g.fillStyle = '#efeaff'; g.font = '12px Silkscreen, monospace'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillText(BOSS_NAMES[b.kind], W/2, 34);
  g.fillStyle = '#2a2546'; g.fillRect(bx, 42, bw, 6);
  g.fillStyle = '#ff5fa2'; g.fillRect(bx, 42, bw * Math.max(0, frac), 6);
}
function draw(){
  const g = cx, th = theme();
  g.save();
  g.fillStyle = th.bg; g.fillRect(0, 0, W, H);
  if (shake > 0) g.translate(fr(-shake, shake), fr(-shake, shake));
  for (const s of stars){ g.fillStyle = s.s > 1 ? th.star : th.star2; g.fillRect(s.x, s.y, s.s, s.s); }
  const alarm = hurry && running && !demo;
  g.fillStyle = alarm ? 'rgba(255,77,77,' + (.45 + Math.sin(clock*10)*.35) + ')' : 'rgba(' + th.ground + ',.4)';
  g.fillRect(10, GROUND, W - 20, 2);
  g.fillStyle = th.shield;
  for (const s of shields) for (let r=0;r<SGH;r++) for (let c=0;c<SGW;c++) if (s.cells[r*SGW+c]) g.fillRect(s.x + c*SC, s.y + r*SC, SC, SC);
  for (const e of enemies){ if (!e.alive) continue; const p = epos(e);
    drawEnemy(g, e.type, p.x, p.y, e.mode === 'form' ? animF : (Math.floor(clock*8) & 1), e.armored && e.hp > 1, e.flash > 0, e.type === 's' && shieldOpen(e)); }
  if (ufo) drawUfo(g, ufo.x, ufo.y, clock);
  if (boss) drawBoss(boss);
  g.font = '700 10px "JetBrains Mono", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const d of drops){ const P = PW[d.k];
    g.fillStyle = P.col; g.beginPath(); if (g.roundRect) g.roundRect(d.x-14, d.y-8, 28, 16, 8); else g.rect(d.x-14, d.y-8, 28, 16); g.fill();
    g.fillStyle = '#07060f'; g.fillText(P.label, d.x, d.y + 1); }
  for (const b of pBolts){
    if (b.pierce){ g.fillStyle = '#ff4d4d'; g.fillRect(b.x-2.5, b.y-13, 5, 26); g.fillStyle = '#ffd6d6'; g.fillRect(b.x-1, b.y-13, 2, 26); }
    else { g.fillStyle = '#ffcf4a'; g.fillRect(b.x-1.5, b.y-7, 3, 14); }
  }
  for (const b of eBolts){
    if (b.kind === 3){ g.fillStyle = '#ff5fa2'; g.beginPath(); g.arc(b.x, b.y, 4.5, 0, TAU); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(b.x, b.y, 1.8, 0, TAU); g.fill(); }
    else if (b.kind === 1){ g.strokeStyle = '#ff8a3d'; g.lineWidth = 2; const o = (Math.floor(clock*14) & 1) ? 3 : -3;
      g.beginPath(); g.moveTo(b.x, b.y-8); g.lineTo(b.x+o, b.y-4); g.lineTo(b.x-o, b.y); g.lineTo(b.x+o, b.y+4); g.lineTo(b.x, b.y+8); g.stroke(); }
    else if (b.kind === 2){ g.fillStyle = '#f4e04d'; g.fillRect(b.x-1.5, b.y-8, 3, 16); const k = (Math.floor(clock*12) % 3) - 1; g.fillRect(b.x-4, b.y + k*5 - 1, 8, 2); }
    else { g.fillStyle = '#ff8a3d'; g.fillRect(b.x-1.5, b.y-6, 3, 12); }
  }
  if (ship.alive && !(ship.inv > 0 && (Math.floor(clock*12) & 1))) drawShip(ship.x, PY);
  if (ship.alive && bubble){ g.strokeStyle = 'rgba(75,227,138,' + (.5 + Math.sin(clock*6)*.25) + ')'; g.lineWidth = 2; g.beginPath(); g.arc(ship.x, PY - 1, 28, 0, TAU); g.stroke(); }
  g.lineCap = 'round';
  for (const b of booms){
    const k = b.t / .28, len = (6 + k*26) * b.size, inner = k*14*b.size;
    g.globalAlpha = 1 - k; g.strokeStyle = b.col; g.lineWidth = 2.5;
    g.beginPath();
    for (let i=0;i<8;i++){ const a = i*TAU/8 + (i&1)*.2; const l = i & 1 ? len*.6 : len;
      g.moveTo(b.x + Math.cos(a)*inner, b.y + Math.sin(a)*inner); g.lineTo(b.x + Math.cos(a)*l, b.y + Math.sin(a)*l); }
    g.stroke();
    if (k < .35){ g.fillStyle = '#ffffff'; g.beginPath(); g.arc(b.x, b.y, 5*b.size*(1-k), 0, TAU); g.fill(); }
  }
  g.globalAlpha = 1;
  for (const r of rings){ g.strokeStyle = r.col; g.globalAlpha = Math.max(0, 1 - r.r/700); g.lineWidth = 4; g.beginPath(); g.arc(r.x, r.y, r.r, 0, TAU); g.stroke(); g.globalAlpha = 1; }
  for (const p of parts){ g.globalAlpha = Math.max(0, p.life/p.max); g.fillStyle = p.col; g.fillRect(p.x, p.y, p.s, p.s); }
  g.globalAlpha = 1;
  g.font = '14px Silkscreen, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const f of floats){ g.globalAlpha = Math.min(1, f.life*1.5); g.fillStyle = f.col; g.fillText(f.t, f.x, f.y); }
  g.globalAlpha = 1;
  g.restore();
}

  paused = force !== undefined ? force : !paused;
  $('oPause').hidden = !paused;
  $('bPause').textContent = paused ? '▶' : 'II';
}

}

const isFire = k => k === 'Space' || k === 'ArrowUp' || k === 'KeyW';
window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ keys.l = true; e.preventDefault(); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD'){ keys.r = true; e.preventDefault(); }
  else if (isFire(e.code)){ if ((e.target.tagName === 'BUTTON' || e.target.tagName === 'A') && e.code === 'Space') return; fireKey = true; e.preventDefault(); ensureAudio(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = false;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
  else if (isFire(e.code)) fireKey = false;
});
const toField = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };
cv.addEventListener('pointerdown', e => {
  if (demo) return; ensureAudio(); firePtr = true;
  const x = toField(e);
  if (e.pointerType === 'mouse') ship.tx = x;
  else drag = { sx:x, shipX:ship.x, lastX:x };
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
});
cv.addEventListener('pointermove', e => {
  if (demo) return;
  const x = toField(e);
  if (e.pointerType === 'mouse') ship.tx = x;
  else if (drag){ drag.lastX = x; ship.tx = drag.shipX + (x - drag.sx) * 1.3; }
});
const ptrUp = () => { firePtr = false; drag = null; };
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
window.addEventListener('blur', () => { fireKey = false; firePtr = false; drag = null; keys.l = keys.r = false; togglePause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) togglePause(true); });

$('bCopy').onclick = () => {
  const txt = $('shareTxt').textContent, btn = $('bCopy');
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($('shareTxt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copyKey = 'selected'; btn.textContent = t(copyKey); };
  try { navigator.clipboard.writeText(txt).then(() => { copyKey = 'copied'; btn.textContent = t(copyKey); }, fallback); } catch(e){ fallback(); }
};
$('bSound').onclick = () => { soundOn = !soundOn; ensureAudio(); paintSound(); store.set('invasori-sound', soundOn ? 'on' : 'off'); };

let last = performance.now();
function frame(now){
  const dt = Math.min(.033, (now - last)/1000); last = now;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
setLang(lang, false);
goHome();
requestAnimationFrame(frame);
})();
</script>
<script>
/* altezza del gioco alla pagina madre quando è dentro un iframe */
(() => {
  if (window.self === window.top) return;
  let last = 0;
  const send = () => {
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h && h !== last){ last = h; window.parent.postMessage({ type:'invasori-height', height:h }, '*'); }
  };
  new ResizeObserver(send).observe(document.documentElement);
  window.addEventListener('load', send);
  send();
})();
</script>
